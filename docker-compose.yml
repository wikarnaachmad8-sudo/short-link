services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shortlink-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8096:8096"
    command: php artisan serve --host=0.0.0.0 --port=8096

    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

